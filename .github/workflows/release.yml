name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: a4dj.exe
          path: a4dj.exe
          overwrite: 'true'

  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: a4dj.exe
          path: bins
      - name: GitHub Release
        run: |
          gh release delete "${GITHUB_REF_NAME}" --repo ${{ github.repository }} || true
          gh release create "${GITHUB_REF_NAME}" --repo ${{ github.repository }} --title "${GITHUB_REF_NAME}" bins/a4dj.exe --notes "Automated release of ${GITHUB_REF_NAME}"
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
